name: BARBERCRAFT feature checks
on:
  pull_request:
  push:
    branches:
      - feature/barbercraft-zones-passport-rewards
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS, HTML and feature wiring
        run: node tests/barbercraft-smoke.mjs
