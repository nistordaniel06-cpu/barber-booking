name: BARBERCRAFT feature checks
on:
  pull_request:
  push:
    branches:
      - feature/barbercraft-zones-passport-rewards
      - feature/barbercraft-reward-redemption-qr-zones
      - feature/barbercraft-premium-photo-ui
      - fix/war-map-single-controls-admin-pro
      - feature/barbercraft-social-passports-verified-reviews
      - feature/ro-map-referrals-kingdoms-salon-removal
      - fix/social-feed-responsive-qr-geolocation
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS, HTML and feature wiring
        run: |
          node tests/barbercraft-smoke.mjs
          node tests/barbercraft-rewards-smoke.mjs
          node tests/barbercraft-premium-smoke.mjs
          node tests/barbercraft-map-regressions.mjs
          node tests/barbercraft-social-smoke.mjs
          node tests/barbercraft-growth-smoke.mjs
          node tests/barbercraft-social-feed-qr-smoke.mjs
