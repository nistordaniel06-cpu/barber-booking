name: BARBERCRAFT feature checks
on:
  pull_request:
  push:
    branches:
      - main
      - feature/barbercraft-zones-passport-rewards
      - feature/barbercraft-reward-redemption-qr-zones
      - feature/barbercraft-premium-photo-ui
      - fix/war-map-single-controls-admin-pro
      - feature/barbercraft-social-passports-verified-reviews
      - feature/ro-map-referrals-kingdoms-salon-removal
      - fix/social-feed-responsive-qr-geolocation
      - feature/kingdom-polish-explore-admin-mobile
      - feature/admin-mero-delete-4men-client-pilot
      - fix/admin-explore-luxury-mobile-tiles
      - feature/explore-catalog-real-booking
      - fix/email-confirmation-github-social-checkbox
      - fix/admin-client-approval-nav-referral-client-links
      - fix/passport-private-gallery-mobile-upload
      - fix/isolated-client-pro-admin-sessions
      - fix/email-confirmation-resend-recovery
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS, HTML and feature wiring
        run: |
          node tests/barbercraft-smoke.mjs
          node tests/barbercraft-rewards-smoke.mjs
          node tests/barbercraft-premium-smoke.mjs
          node tests/barbercraft-map-regressions.mjs
          node tests/barbercraft-social-smoke.mjs
          node tests/barbercraft-social-gallery-quotas-smoke.mjs
          node tests/barbercraft-growth-smoke.mjs
          node tests/barbercraft-social-feed-qr-smoke.mjs
          node tests/barbercraft-kingdom-explore-mobile-smoke.mjs
          node tests/barbercraft-pilot-import-smoke.mjs
          node tests/barbercraft-admin-luxury-smoke.mjs
          node tests/barbercraft-explore-public-booking-approvals-smoke.mjs
          node tests/barbercraft-auth-email-social-toggle-smoke.mjs
          node tests/barbercraft-client-link-navigation-smoke.mjs
          node tests/barbercraft-private-gallery-smoke.mjs
          node tests/barbercraft-portal-session-isolation-smoke.mjs
          node tests/barbercraft-three-portals-smoke.mjs
          node tests/barbercraft-auth-resend-recovery-smoke.mjs
